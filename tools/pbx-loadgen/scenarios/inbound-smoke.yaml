target:
  host: 127.0.0.1
  port: 5060
  transport: udp
  requestUriTemplate: "sip:{did}@127.0.0.1:5060"
load:
  cps: 1
  maxConcurrent: 1
  totalCalls: 1
  rampUpSeconds: 0
  callStartJitterMs: 0
callFlow:
  callerIdPool: ["01011112222"]
  didPool: ["1899"]
  answerTimeoutMs: 8000
  holdSecondsMin: 3
  holdSecondsMax: 5
  disconnectMode:
    normalPercent: 100
media:
  beepIntervalMs: 800
  txGain: 0.8
reporting:
  outputDir: "./reports"
  consoleRefreshMs: 500
  saveFailureDetails: true
