target:
  host: 127.0.0.1
  port: 5060
  transport: udp
  requestUriTemplate: "sip:{did}@127.0.0.1:5060"
load:
  cps: 2
  maxConcurrent: 5
  totalCalls: 20
  rampUpSeconds: 10
  callStartJitterMs: 200
callFlow:
  callerIdPool:
    - "01000000001"
    - "01000000002"
    - "01000000003"
  didPool: ["07000000000"]
  answerTimeoutMs: 12000
  holdSecondsMin: 5
  holdSecondsMax: 10
  disconnectMode:
    normalPercent: 100
media:
  beepIntervalMs: 800
  txGain: 0.8
reporting:
  outputDir: "./reports/p1-regression"
  consoleRefreshMs: 500
  saveFailureDetails: true
