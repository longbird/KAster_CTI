target:
  host: 127.0.0.1
  port: 5060
  transport: udp
  requestUriTemplate: "sip:{did}@127.0.0.1:5060"
load:
  cps: 1
  maxConcurrent: 1
  totalCalls: 1
  rampUpSeconds: 0
  callStartJitterMs: 0
callFlow:
  callerIdPool: ["01000000001"]
  didPool: ["07000000000"]
  answerTimeoutMs: 12000
  holdSecondsMin: 5
  holdSecondsMax: 5
  disconnectMode:
    normalPercent: 100
media:
  beepIntervalMs: 800
  txGain: 0.8
reporting:
  outputDir: "./reports/p1-smoke"
  consoleRefreshMs: 500
  saveFailureDetails: true
