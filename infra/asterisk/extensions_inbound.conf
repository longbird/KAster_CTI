[inbound-main]
exten => 07012345678,1,NoOp(Inbound DID ${EXTEN} / ANI=${CALLERID(num)})
 same => n,Set(__TENANT_CODE=main)
 same => n,Set(__ENTRY_DID=${EXTEN})
 same => n,Set(__CALL_LINKEDID=${CHANNEL(linkedid)})
 same => n,Set(__ANI=${CALLERID(num)})
 same => n,Set(__DNIS=${EXTEN})
 same => n,Set(CHANNEL(language)=ko)
 same => n,Goto(inbound-ivr,s,1)

[inbound-ivr]
exten => s,1,Answer()
 same => n,Playback(custom/welcome)
 same => n,Background(custom/main_menu)
 same => n,WaitExten(5)

exten => 1,1,Set(__QUEUE_NAME=sales)
 same => n,Goto(queue-entry,s,1)

exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()
