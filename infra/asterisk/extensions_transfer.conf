; conv 26: blind/attended transfer 전용 dialplan context.
; CallsService.transfer 가 AMI Redirect 액션을 이 context 로 보낸다.
;
; 흐름:
;   1) 서버가 REST /calls/{id}/transfer 를 받음
;   2) CallsService 가 call_transfers row 를 만들고 sessionStatus=TRANSFERRING 로 갱신
;   3) AMI 'Action: Redirect' 를 activeChannel 에 쏴서 여기 context 로 점프
;   4) 여기서 목적지(내선 or 외부)에 맞게 Dial 을 수행
;   5) 성공/실패는 AMI 이벤트(DialBegin/DialEnd/BridgeEnter/Hangup) 로 SessionEngine 에 반영

[transfer-target]
exten => _X.,1,NoOp(Transfer target=${EXTEN} linkedid=${CHANNEL(linkedid)})
 same => n,Set(__TRANSFER_TO=${EXTEN})
 same => n,ExecIf($[${LEN(${EXTEN})} <= 4]?Goto(transfer-internal,${EXTEN},1):Goto(transfer-external,${EXTEN},1))
 same => n,Hangup()

[transfer-internal]
exten => _X.,1,NoOp(Internal transfer to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20,tT)
 same => n,NoOp(Transfer result: ${DIALSTATUS})
 same => n,Hangup()

[transfer-external]
exten => _X.,1,NoOp(External transfer to ${EXTEN})
 same => n,Set(CALLERID(num)=${COMPANY_MAIN_DID})
 same => n,Dial(PJSIP/${EXTEN}@trunk-provider,60,tT)
 same => n,NoOp(Transfer result: ${DIALSTATUS})
 same => n,Hangup()
