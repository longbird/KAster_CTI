# writer 는 Patroni REST 의 /primary 헬스체크로 현재 primary 한 대만 고른다.
# 앱의 DATABASE_URL 은 항상 이 엔드포인트를 본다.
listen postgres-writer
  bind *:5432
  mode tcp
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server db1 ${DB1_HOST}:5432 check port 8008
  server db2 ${DB2_HOST}:5432 check port 8008

# 읽기 전용 조회를 분산하고 싶을 때만 사용한다.
# 주의: 복제 지연 때문에 방금 쓴 값이 안 보일 수 있으므로 CTI 세션 조회에는 쓰지 않는다.
listen postgres-reader
  bind *:5433
  mode tcp
  option httpchk GET /replica
  http-check expect status 200
  default-server inter 3s fall 3 rise 2
  server db1 ${DB1_HOST}:5432 check port 8008
  server db2 ${DB2_HOST}:5432 check port 8008
