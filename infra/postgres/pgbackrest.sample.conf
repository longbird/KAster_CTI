# 백업 저장소는 반드시 운영 DB 와 다른 장애 도메인에 둔다.
# 같은 호스트/같은 디스크에 두면 그 디스크가 죽을 때 백업도 같이 죽는다.
[global]
repo1-path=/backup/pgbackrest
repo1-retention-full=5
repo1-retention-diff=35
start-fast=y
process-max=4
compress-type=zst
log-level-console=info
log-level-file=detail

[global:archive-push]
compress-level=3

[kcti]
pg1-path=/var/lib/postgresql/16/main
pg1-port=5432
