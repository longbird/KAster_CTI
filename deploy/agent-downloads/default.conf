# 상담원 데스크톱 설치 파일 공개 배포.
#
# 이 경로에는 인증이 없다. 주소를 아는 누구나 받을 수 있다 — 의도된 것이다.
# 최초 설치 문제를 풀기 위한 자리다: 앱이 없는 상담원은 업데이트 토큰을 받을 방법이
# 없어서 인증된 경로(/api/v1/agent-updates/...)에 들어가지 못한다.
#
# 인증이 걸린 자동 업데이트 경로는 이것과 별개로 그대로 살아 있다.
# 여기는 파일을 내보내기만 하고, 그 외에는 아무것도 하지 않는다.

limit_conn_zone $binary_remote_addr zone=agent_downloads_per_ip:10m;

server {
    listen 80;
    server_name _;

    root /srv/downloads;

    # 받는 것 말고는 받아 주지 않는다. 올리거나 지우려는 요청은 전부 거절한다.
    limit_except GET HEAD {
        deny all;
    }

    # 한 곳이 동시에 여러 개를 당겨 대역폭을 통째로 먹지 않게 한다.
    # 설치 파일이 55MB 라 이것이 없으면 몇 사람이 콜센터 회선을 다 쓴다.
    limit_conn agent_downloads_per_ip 3;

    # 버전이 여럿일 때 무엇이 있는지 보이게 한다. 릴리스마다 손볼 것이 없다.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
