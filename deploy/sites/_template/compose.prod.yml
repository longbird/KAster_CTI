services:
  gateway:
    image: nginx:1.27-alpine
    container_name: kaster-${SITE_CODE}-gateway
    restart: unless-stopped
    depends_on:
      - web
      - admin
      - server
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${HTTP_PORT:-80}:80"

  postgres:
    image: postgres:16
    container_name: kaster-${SITE_CODE}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: kaster-${SITE_CODE}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ../../..
      dockerfile: apps/server/Dockerfile.prod
    image: kaster/${SITE_CODE}-server:latest
    container_name: kaster-${SITE_CODE}-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AMI_HOST: ${AMI_HOST}
      AMI_PORT: ${AMI_PORT}
      AMI_USERNAME: ${AMI_USERNAME}
      AMI_SECRET: ${AMI_SECRET}
      AMI_RECONNECT_MS: ${AMI_RECONNECT_MS}
      ASTERISK_NODE_ID: ${ASTERISK_NODE_ID}
      ASTERISK_OUTBOUND_CONTEXT: ${ASTERISK_OUTBOUND_CONTEXT}
      ASTERISK_ATXFER_COMPLETE_CODE: ${ASTERISK_ATXFER_COMPLETE_CODE}
      ASTERISK_HOLD_FEATURE_CODE: ${ASTERISK_HOLD_FEATURE_CODE}
      ASTERISK_RESUME_FEATURE_CODE: ${ASTERISK_RESUME_FEATURE_CODE}
      ASTERISK_CONF_DIR: ${ASTERISK_CONF_DIR}
      REST_CORS_ORIGIN: ${REST_CORS_ORIGIN}
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN}
      AUTO_SEED_DEMO_DATA: ${AUTO_SEED_DEMO_DATA:-false}
      KASTER_INTERNAL_SECRET: ${KASTER_INTERNAL_SECRET}
      PACKET_CAPTURE_ENABLED: ${PACKET_CAPTURE_ENABLED:-false}
      PACKET_CAPTURE_STORAGE_ROOT: /var/spool/kaster/packet-capture
      PACKET_CAPTURE_INTERFACE: ${PACKET_CAPTURE_INTERFACE:-any}
      PACKET_CAPTURE_MAX_DURATION_SECONDS: ${PACKET_CAPTURE_MAX_DURATION_SECONDS:-600}
      PACKET_CAPTURE_MAX_FILE_MB: ${PACKET_CAPTURE_MAX_FILE_MB:-500}
      PACKET_CAPTURE_RETENTION_DAYS: ${PACKET_CAPTURE_RETENTION_DAYS:-7}
      CAPTURE_AGENT_SOCKET: /var/run/kaster/capture.sock
    volumes:
      # 상담원 데스크톱 설치 파일. scripts/publish-desktop-release.sh 가 호스트 쪽에 놓고
      # 서버는 읽기만 한다. 이 마운트가 없으면 릴리스 등록은 성공하는데 상담원이
      # "받기" 를 누르는 순간 404 가 나고, 그 실패는 서버 로그에만 남는다.
      - ${AGENT_ARTIFACT_DIR:-./agent-artifacts}:/var/lib/kaster/agent-artifacts:ro
      # capture-agent 와 공유한다. 소켓으로 지시하고, pcap 은 서버가 읽어 해시·암호화한다.
      - kaster_capture_ipc:/var/run/kaster
      - kaster_capture_data:/var/spool/kaster/packet-capture

  capture-agent:
    build:
      context: ../../..
      dockerfile: apps/capture-agent/Dockerfile
    container_name: kaster-${SITE_CODE}-capture-agent
    restart: unless-stopped
    # 호스트의 SIP(:36070/:48950)·RTP(10000-20000)를 보려면 호스트 네트워크가 필요하다.
    # server 를 host 네트워크로 옮기면 postgres/redis 서비스명 DNS 와 ports 매핑이 깨지므로,
    # 호스트 네트워크와 NET_RAW 는 이 작은 프로세스에만 준다.
    network_mode: host
    cap_add:
      - NET_RAW
    environment:
      KASTER_INTERNAL_SECRET: ${KASTER_INTERNAL_SECRET:-change_me_internal}
      CAPTURE_AGENT_SOCKET: /var/run/kaster/capture.sock
      PACKET_CAPTURE_STORAGE_ROOT: /var/spool/kaster/packet-capture
      PACKET_CAPTURE_MAX_FILE_MB: ${PACKET_CAPTURE_MAX_FILE_MB:-500}
    volumes:
      - kaster_capture_ipc:/var/run/kaster
      - kaster_capture_data:/var/spool/kaster/packet-capture

  web:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_USE_MOCK: ${VITE_USE_MOCK}
    image: kaster/${SITE_CODE}-web:latest
    container_name: kaster-${SITE_CODE}-web
    restart: unless-stopped
    depends_on:
      - server

  admin:
    build:
      context: ../../..
      dockerfile: apps/admin/Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_USE_MOCK: ${VITE_USE_MOCK}
        VITE_ACCESS_TOKEN_KEY: ${VITE_ACCESS_TOKEN_KEY}
    image: kaster/${SITE_CODE}-admin:latest
    container_name: kaster-${SITE_CODE}-admin
    restart: unless-stopped
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  kaster_capture_ipc:
  kaster_capture_data:
