<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #4ea3dd; } a:hover { color: #6cb6e6; }
    .win { width: 560px; height: 720px; overflow: hidden; box-sizing: border-box;
           font-family: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
           font-size: 14px; display: flex; flex-direction: column;
           background: #12161d; color: #e6ecf3; }
    .num { font-variant-numeric: tabular-nums; }
    .tab { padding: 9px 14px; font-size: 13px; color: #8896a8; border-bottom: 2px solid transparent; }
    .tab.on { color: #e6ecf3; font-weight: 600; border-bottom-color: #4ea3dd; }
    .lbl { font-size: 12px; color: #8896a8; }
    .inp { height: 34px; border: 1px solid #37414f; border-radius: 4px; background: #222a35;
           display: flex; align-items: center; padding: 0 10px; font-size: 13px; }
    .sect { font-size: 12px; letter-spacing: .04em; color: #8896a8; font-weight: 600;
            margin: 18px 0 8px; }
  </style>
</helmet>

<div class="win">

  <div style="height: 48px; flex: none; background: #1a202a; border-bottom: 1px solid #2a3240;
              display: flex; align-items: center; padding: 0 20px">
    <div style="font-size: 16px; font-weight: 600">설정</div>
    <div style="flex: 1"></div>
    <div style="font-size: 12px; color: #8896a8" class="num">1.4.2</div>
  </div>

  <div style="flex: none; display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid #2a3240; background: #1a202a">
    <div class="tab">서버</div>
    <div class="tab">오디오</div>
    <div class="tab">핫키</div>
    <div class="tab">전환</div>
    <div class="tab">통화</div>
    <div class="tab on">일반</div>
    <div class="tab">앱</div>
  </div>

  <!-- 탭 내용만 스크롤한다. 항목이 늘어도 창은 그대로다. -->
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 20px">

    <div class="sect">시작과 표시</div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid #222a35">
      <div style="width: 36px; height: 20px; border-radius: 999px; background: #35c48c; flex: none; position: relative; margin-top: 1px">
        <span style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 999px; background: #0d1218"></span>
      </div>
      <div style="flex: 1">
        <div style="font-size: 13px">윈도우에 로그인하면 함께 시작</div>
        <div class="lbl" style="margin-top: 2px">자리를 나눠 쓰는 PC 라면 자리마다 따로 등록됩니다.</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid #222a35">
      <div style="width: 36px; height: 20px; border-radius: 999px; background: #2a3240; flex: none; position: relative; margin-top: 1px">
        <span style="position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #6d7d91"></span>
      </div>
      <div style="flex: 1"><div style="font-size: 13px">다른 창 위에 늘 보이기</div></div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid #222a35">
      <div style="width: 36px; height: 20px; border-radius: 999px; background: #35c48c; flex: none; position: relative; margin-top: 1px">
        <span style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 999px; background: #0d1218"></span>
      </div>
      <div style="flex: 1">
        <div style="font-size: 13px">닫기를 누르면 트레이로 내리기</div>
        <!-- 이 설명이 이 항목의 핵심이다. 조용히 내려가면 빈 자리로 전화가 간다. -->
        <div class="lbl" style="margin-top: 2px">
          트레이로 내려가면 <span style="color: #e0a83a">자리비움</span>으로 바뀌어 전화가 배정되지 않습니다.
          통화 중이면 통화가 끝난 뒤에 바뀝니다.
        </div>
      </div>
    </div>

    <div class="sect">벨소리</div>
    <div style="display: flex; gap: 8px; align-items: center">
      <div class="inp" style="flex: 1; justify-content: space-between">
        <span>클래식</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8896a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div style="height: 34px; border: 1px solid #37414f; border-radius: 4px; padding: 0 12px; background: #222a35;
                  display: flex; align-items: center; gap: 6px; font-size: 13px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5.5 18 12 8 18.5Z"/></svg>
        <span>들어보기</span>
      </div>
    </div>
    <div class="lbl" style="margin-top: 6px">
      나가는 장치는 오디오 탭의 벨소리 스피커를 따릅니다. 무음으로 두면 화면과 트레이 알림만 남습니다.
    </div>

    <div class="sect">대기 전화 알림</div>
    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 4px 0">
      <div style="width: 36px; height: 20px; border-radius: 999px; background: #35c48c; flex: none; position: relative; margin-top: 1px">
        <span style="position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 999px; background: #0d1218"></span>
      </div>
      <div style="flex: 1">
        <div style="font-size: 13px">큐에 새 전화가 들어오면 알림</div>
        <div class="lbl" style="margin-top: 2px">자리비움 중에는 알리지 않습니다.</div>
      </div>
    </div>
  </div>

  <div style="flex: none; border-top: 1px solid #2a3240; background: #1a202a; padding: 12px 20px;
              display: flex; gap: 8px; justify-content: flex-end">
    <div style="height: 36px; border: 1px solid #37414f; border-radius: 4px; padding: 0 18px; background: #222a35;
                display: flex; align-items: center; font-size: 13px">취소</div>
    <div style="height: 36px; border-radius: 4px; padding: 0 22px; background: #4ea3dd; color: #0d1218;
                display: flex; align-items: center; font-size: 13px; font-weight: 700">저장</div>
  </div>
</div>
</x-dc>
</body>
</html>
