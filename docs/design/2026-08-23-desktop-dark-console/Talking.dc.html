<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #4ea3dd; } a:hover { color: #6cb6e6; }
    .win { width: 440px; height: 560px; overflow: hidden; box-sizing: border-box;
           font-family: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
           font-size: 14px; display: flex; flex-direction: column;
           background: #12161d; color: #e6ecf3; }
    .num { font-variant-numeric: tabular-nums; }
    .act { height: 52px; border: 1px solid #37414f; border-radius: 6px; background: #1a202a;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 3px; font-size: 12px; color: #c6d0dc; }
  </style>
</helmet>

<div class="win">

  <div style="height: 44px; flex: none; background: #1a202a; border-bottom: 2px solid #35c48c;
              display: flex; align-items: center; padding: 0 16px; gap: 10px">
    <div style="font-weight: 600">홍길동</div>
    <div style="font-size: 12px; color: #8896a8" class="num">1001</div>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #35c48c; font-weight: 600">
      <svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" fill="#35c48c"/></svg>
      <span>통화 중</span>
    </div>
  </div>

  <!-- 상대와 경과. 통화 중 가장 자주 보는 두 값이라 위에 크게 둔다. -->
  <div style="flex: none; padding: 20px 16px 16px; text-align: center">
    <div class="num" style="font-size: 28px; font-weight: 700; letter-spacing: -.01em">010-3462-3453</div>
    <div style="font-size: 13px; color: #8896a8; margin-top: 4px">김영희 &middot; 기본</div>
    <div class="num" style="font-size: 15px; color: #35c48c; font-weight: 600; margin-top: 8px">04:17</div>
  </div>

  <div style="flex: none; padding: 0 16px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div class="act">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="1.7" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
        <span>보류</span>
      </div>
      <div class="act">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        <span>마이크</span>
      </div>
      <div class="act">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c6d0dc" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="1.4"/><circle cx="12" cy="7" r="1.4"/><circle cx="17" cy="7" r="1.4"/><circle cx="7" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="17" cy="12" r="1.4"/><circle cx="7" cy="17" r="1.4"/><circle cx="12" cy="17" r="1.4"/><circle cx="17" cy="17" r="1.4"/></svg>
        <span>키패드</span>
      </div>
      <div class="act" style="border-color: #4ea3dd; color: #4ea3dd">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ea3dd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg>
        <span>전환</span>
      </div>
    </div>
  </div>

  <!-- 메모. 통화 중에 적는 자리라 접히지 않고 늘 열려 있다. -->
  <div style="flex: 1; min-height: 0; padding: 14px 16px 0; display: flex; flex-direction: column">
    <div style="font-size: 12px; color: #8896a8; margin-bottom: 6px">통화 메모</div>
    <div style="flex: 1; min-height: 0; background: #1a202a; border: 1px solid #2a3240; border-radius: 6px;
                padding: 10px 12px; color: #6d7d91; font-size: 13px; overflow-y: auto">
      배송 지연 문의. 주문번호 확인 후 재안내 예정
    </div>
  </div>

  <div style="flex: none; padding: 12px 16px">
    <div style="height: 48px; border-radius: 6px; background: #ff6b6b; color: #14171c;
                display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14171c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 13.5c5-4.5 12-4.5 17 0l-2 2-3.5-1.5v-2.2c-2.6-.8-5.4-.8-8 0v2.2L3.5 15.5Z"/></svg>
      <span>통화 끊기</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
