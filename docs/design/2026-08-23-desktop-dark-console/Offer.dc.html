<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #4ea3dd; } a:hover { color: #6cb6e6; }
    .win { width: 440px; height: 560px; overflow: hidden; box-sizing: border-box;
           font-family: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
           font-size: 14px; display: flex; flex-direction: column;
           background: #12161d; color: #e6ecf3; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div class="win">

  <!-- 수신 중에는 신원 막대가 색을 띤다. 창이 가려져 있다가 나와도 무슨 상황인지 즉시 읽힌다. -->
  <div style="height: 44px; flex: none; background: #1a202a; border-bottom: 2px solid #4ea3dd;
              display: flex; align-items: center; padding: 0 16px; gap: 10px">
    <div style="font-weight: 600">홍길동</div>
    <div style="font-size: 12px; color: #8896a8" class="num">1001</div>
    <div style="flex: 1"></div>
    <div style="font-size: 12px; color: #4ea3dd; font-weight: 600">호 배정 대기</div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column;
              align-items: center; justify-content: center; padding: 0 24px; text-align: center">

    <div style="font-size: 12px; letter-spacing: .06em; color: #8896a8">받으시겠습니까?</div>

    <div class="num" style="font-size: 34px; font-weight: 700; margin-top: 10px; letter-spacing: -.01em">
      010-3462-3453
    </div>
    <div style="font-size: 13px; color: #8896a8; margin-top: 6px">기본 &middot; 대표번호 070-5234-6380</div>

    <!-- 남은 시간. 숫자보다 막대가 먼저 읽힌다. -->
    <div style="width: 100%; margin-top: 24px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #8896a8">
        <span>남은 시간</span>
        <span class="num" style="color: #e0a83a; font-weight: 700; font-size: 15px">6초</span>
      </div>
      <div style="height: 4px; background: #222a35; border-radius: 999px; margin-top: 6px; overflow: hidden">
        <div style="width: 60%; height: 100%; background: #e0a83a; border-radius: 999px"></div>
      </div>
    </div>

    <div style="display: flex; gap: 10px; width: 100%; margin-top: 28px">
      <div style="flex: 1; height: 48px; border: 1px solid #37414f; border-radius: 6px; background: #222a35;
                  display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5 5 19"/></svg>
        <span>거절</span>
      </div>
      <div style="flex: 1.4; height: 48px; border-radius: 6px; background: #35c48c; color: #0d1218;
                  display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d1218" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4h3l1.5 4-2 1.5a11 11 0 0 0 5.5 5.5L16 13l4 1.5v3a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 4 6.2 2 2 0 0 1 6.5 4Z"/></svg>
        <span>수락</span>
      </div>
    </div>
  </div>

  <div style="flex: none; background: #1a202a; border-top: 1px solid #2a3240; padding: 10px 16px;
              font-size: 12px; color: #8896a8; display: flex; align-items: center; gap: 8px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8896a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l3 1.5"/></svg>
    <span>수락하면 전화기가 연결됩니다. 그 전까지 고객은 대기음을 듣습니다.</span>
  </div>
</div>
</x-dc>
</body>
</html>
